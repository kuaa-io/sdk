[package]
name = "kuaa-io-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "KUAA's SDK for Rust: identity verification cases (KYC, KYB, age), parties, captures, decisions, dossiers and webhooks."
license = "MIT"
homepage = "https://kuaa.io"
repository = "https://github.com/kuaa-io/sdk"
documentation = "https://docs.rs/kuaa-io-sdk"
readme = "README.md"
keywords = ["kuaa", "kyc", "identity", "api", "webhooks"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
hmac = "0.13"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.100"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"] }
