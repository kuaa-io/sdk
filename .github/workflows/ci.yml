name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      # The tests run TypeScript directly, which Node does from 22.18.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The oldest version each SDK promises, so nothing newer slips in.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json
          tools: phpstan
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '27'
      # Pinned: the formatter's output, which the drift check reads, changes
      # between Dart releases.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: pip install mypy
      - run: ./check.sh
        env:
          CHECK_DRIFT: '1'
          SKIP_SWIFT: '1'

  # Swift needs CryptoKit and Network, which only Apple's platforms have.
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: cd swift && swift test
      - run: swift build
